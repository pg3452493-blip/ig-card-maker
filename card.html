<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600;700;800&family=Poppins:wght@600;700;800&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
    background: #07132b;
    color: #ffffff;
  }

  .card {
    width: 1080px;
    height: 1350px;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #091936 0%, #050e20 100%);
    position: relative;
  }

  /* ~60% of 1350px = 810px */
  .top-media {
    position: relative;
    width: 100%;
    height: 810px;
    overflow: hidden;
    background: #0d2247;
    flex-shrink: 0;
  }

  .top-media img.main-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .logo-badge {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(5, 11, 24, 0.92);
    border: 2px solid #f5b727;
    border-radius: 16px;
    padding: 8px 16px 8px 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
  }

  .logo-badge img {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    object-fit: cover;
    display: block;
    background: #000000;
  }

  .logo-label {
    font-size: 22px;
    font-weight: 800;
    color: #ffd56b;
    letter-spacing: 0.6px;
  }

  /* ~40% of 1350px = 540px */
  .bottom-section {
    height: 540px;
    padding: 18px 36px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: linear-gradient(180deg, #081630 0%, #050c1c 100%);
    flex-shrink: 0;
  }

  /* Top row: Left circular badge + Right red heading box */
  .header-row {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-shrink: 0;
  }

  .player-circle-wrap {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, #ef4444, #f5b727);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
    flex-shrink: 0;
  }

  .player-circle-wrap img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 18%;
    transform: scale(1.18);
    border: 3px solid #07132b;
    display: block;
    background: #10264e;
  }

  .red-heading-box {
    flex: 1;
    min-height: 104px;
    background: linear-gradient(90deg, #b91c1c 0%, #dc2626 60%, #991b1b 100%);
    border: 2px solid #f5b727;
    border-radius: 18px;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
  }

  .heading-text {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.2;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
  }

  /* Compact dark box with larger description text */
  .quote-box {
    flex: 1;
    background: rgba(13, 31, 65, 0.96);
    border: 2px solid rgba(245, 183, 39, 0.45);
    border-radius: 22px;
    padding: 16px 26px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }

  .quote-mark-open {
    position: absolute;
    top: 6px;
    left: 16px;
    font-size: 46px;
    line-height: 0.7;
    color: #ef4444;
    font-weight: 800;
  }

  .quote-text {
    font-size: 32px;
    font-weight: 700;
    line-height: 1.38;
    color: #f8fafc;
    padding: 8px 28px;
    text-align: left;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
  }

  .quote-mark-close {
    position: absolute;
    bottom: 2px;
    right: 16px;
    font-size: 46px;
    line-height: 0.6;
    color: #ef4444;
    font-weight: 800;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top-media">
      <img class="main-photo" src="{{image_url}}" alt="Cricket News" onerror="this.onerror=null;this.src='{{logo_url}}';">
      <div class="logo-badge">
        <img src="{{logo_url}}" alt="CCN Logic Logo" onerror="this.style.display='none'">
        <span class="logo-label">CCN LOGIC</span>
      </div>
    </div>

    <div class="bottom-section">
      <div class="header-row">
        <div class="player-circle-wrap">
          <img src="{{image_url}}" alt="Player Highlight" onerror="this.onerror=null;this.src='{{logo_url}}';">
        </div>

        <div class="red-heading-box">
          <div class="heading-text">{{heading}}</div>
        </div>
      </div>

      <div class="quote-box">
        <span class="quote-mark-open">“</span>
        <div class="quote-text">{{quote}}</div>
        <span class="quote-mark-close">”</span>
      </div>
    </div>
  </div>
</body>
</html>
