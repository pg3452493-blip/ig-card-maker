<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600;700;800&family=Poppins:wght@600;700;800&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
    background: #07132b;
    color: #ffffff;
  }

  .card {
    width: 1080px;
    height: 1350px;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #091936 0%, #050e20 100%);
    position: relative;
  }

  .top-media {
    position: relative;
    width: 100%;
    height: 520px;
    overflow: hidden;
    background: #0d2247;
    flex-shrink: 0;
  }

  .top-media img.main-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .logo-badge {
    position: absolute;
    top: 22px;
    right: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(5, 11, 24, 0.92);
    border: 2px solid #f5b727;
    border-radius: 16px;
    padding: 8px 16px 8px 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
  }

  .logo-badge img {
    width: 62px;
    height: 62px;
    border-radius: 12px;
    object-fit: cover;
    display: block;
    background: #000000;
  }

  .logo-label {
    font-size: 21px;
    font-weight: 800;
    color: #ffd56b;
    letter-spacing: 0.6px;
  }

  .heading-bar {
    background: linear-gradient(90deg, #991b1b 0%, #dc2626 50%, #991b1b 100%);
    padding: 18px 34px;
    border-top: 4px solid #f5b727;
    border-bottom: 4px solid #f5b727;
    text-align: center;
    flex-shrink: 0;
    z-index: 2;
  }

  .heading-text {
    font-size: 40px;
    font-weight: 800;
    line-height: 1.22;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }

  .quote-section {
    flex: 1;
    padding: 68px 42px 34px;
    display: flex;
    align-items: stretch;
    justify-content: center;
    position: relative;
  }

  /* Circular player badge overlapping top-center of the quote box */
  .player-circle-wrap {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 118px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, #ef4444, #f5b727);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.65);
    z-index: 4;
  }

  .player-circle-wrap img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 18%;
    transform: scale(1.22);
    border: 3px solid #07132b;
    display: block;
    background: #10264e;
  }

  .quote-box {
    width: 100%;
    height: 100%;
    background: rgba(13, 31, 65, 0.95);
    border: 2px solid rgba(245, 183, 39, 0.45);
    border-radius: 26px;
    padding: 66px 36px 26px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
  }

  .quote-top-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 6px;
  }

  .quote-mark-open {
    font-size: 76px;
    line-height: 0.55;
    color: #ef4444;
    font-weight: 800;
    text-shadow: 0 3px 10px rgba(239, 68, 68, 0.35);
  }

  .quote-accent-line {
    height: 3px;
    flex: 1;
    max-width: 120px;
    background: linear-gradient(90deg, #ef4444, transparent);
    border-radius: 2px;
  }

  .quote-text {
    font-size: 27px;
    font-weight: 600;
    line-height: 1.44;
    color: #f8fafc;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 9;
    -webkit-box-orient: vertical;
  }

  .quote-bottom-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    margin-top: 8px;
  }

  .quote-mark-close {
    font-size: 76px;
    line-height: 0.5;
    color: #ef4444;
    font-weight: 800;
    text-shadow: 0 3px 10px rgba(239, 68, 68, 0.35);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top-media">
      <img class="main-photo" src="{{image_url}}" alt="Cricket News" onerror="this.onerror=null;this.src='{{logo_url}}';">
      <div class="logo-badge">
        <img src="{{logo_url}}" alt="CCN Logic Logo" onerror="this.style.display='none'">
        <span class="logo-label">CCN LOGIC</span>
      </div>
    </div>

    <div class="heading-bar">
      <div class="heading-text">{{heading}}</div>
    </div>

    <div class="quote-section">
      <div class="player-circle-wrap">
        <img src="{{image_url}}" alt="Player Highlight" onerror="this.onerror=null;this.src='{{logo_url}}';">
      </div>

      <div class="quote-box">
        <div class="quote-top-row">
          <span class="quote-mark-open">“</span>
          <span class="quote-accent-line"></span>
        </div>

        <div class="quote-text">{{quote}}</div>

        <div class="quote-bottom-row">
          <span class="quote-mark-close">”</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
