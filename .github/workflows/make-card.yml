name: Generate IG Card

on:
  workflow_dispatch:
    inputs:
      image_url:
        required: false
        type: string
      heading:
        required: false
        type: string
      quote:
        required: false
        type: string
      caption:
        required: false
        type: string
      callback_webhook:
        required: false
        type: string
        default: "https://hook.us2.make.com/ws21d8m5pdssfv87dxukv3k6giraxdhp"

jobs:
  build-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Render IG Card
        run: |
          IMG_URL="${{ inputs.image_url }}"
          if [ -z "$IMG_URL" ]; then
            IMG_URL="https://ccnlogic.com/wp-content/uploads/2024/05/cropped-cropped-ccn-logo-1.png"
          fi
          HEADING_TXT="${{ inputs.heading }}"
          if [ -z "$HEADING_TXT" ]; then
            HEADING_TXT="Cricket Update"
          fi
          QUOTE_TXT="${{ inputs.quote }}"
          if [ -z "$QUOTE_TXT" ]; then
            QUOTE_TXT="Latest match highlights and updates"
          fi
          node render_card.js "$IMG_URL" "$HEADING_TXT" "$QUOTE_TXT"

      - name: Upload to WordPress Media
        id: wp_upload
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: |
          RESP=$(curl -s -X POST "$WP_URL/wp-json/wp/v2/media" \
            -u "$WP_USER:$WP_APP_PASS" \
            -H "Content-Disposition: attachment; filename=ig_card_$(date +%s).png" \
            -H "Content-Type: image/png" \
            --data-binary @output/ig_card.png)
          CARD_URL=$(echo "$RESP" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d.source_url || '');")
          echo "card_url=$CARD_URL" >> $GITHUB_OUTPUT
          echo "Uploaded URL: $CARD_URL"

      - name: Send URL and Caption back to Make Webhook
        env:
          CARD_URL: ${{ steps.wp_upload.outputs.card_url }}
          CAPTION_TEXT: ${{ inputs.caption }}
          WEBHOOK_URL: ${{ inputs.callback_webhook || 'https://hook.us2.make.com/uv9e932x3no9q9xv6cj99y3clwlu42pp' }}
        run: |
          node -e '
            const https = require("https");
            const http = require("http");
            const payload = JSON.stringify({
              card_url: process.env.CARD_URL || "",
              caption: process.env.CAPTION_TEXT || ""
            });
            const url = new URL(process.env.WEBHOOK_URL);
            const client = url.protocol === "https:" ? https : http;
            const req = client.request(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(payload)
              }
            }, (res) => {
              let body = "";
              res.on("data", (chunk) => (body += chunk));
              res.on("end", () => {
                console.log("Webhook status:", res.statusCode, body);
              });
            });
            req.on("error", (err) => {
              console.error("Webhook error:", err);
              process.exit(1);
            });
            req.write(payload);
            req.end();
          '
